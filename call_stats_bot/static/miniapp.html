<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SupportFlow · звонки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--tg-theme-secondary-bg-color, #f3f5f8);
      --surface: var(--tg-theme-bg-color, #fff);
      --text: var(--tg-theme-text-color, #172033);
      --muted: var(--tg-theme-hint-color, #7c879d);
      --accent: var(--tg-theme-button-color, #4169e1);
      --accent-text: var(--tg-theme-button-text-color, #fff);
      --line: color-mix(in srgb, var(--muted) 22%, transparent);
      --green: #23a55a; --yellow: #d89a00; --red: #d94b4b; --blue: #4169e1;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font: inherit; }
    .shell { max-width: 760px; margin: 0 auto; padding: max(18px,env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom)); }
    .hero { position: relative; overflow: hidden; padding: 24px; border-radius: 26px; color: #fff; background: linear-gradient(135deg,#243b85,#496ff2 58%,#6a8cff); box-shadow: 0 16px 40px #254cb33d; }
    .hero::after { content:""; position:absolute; width:180px; height:180px; border-radius:50%; right:-70px; top:-80px; background:#ffffff1f; }
    .eyebrow { opacity:.78; font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    h1 { margin:6px 0 4px; font-size:27px; line-height:1.1; }
    .hero p { margin:0; opacity:.82; }
    .report-picker { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; margin-top:14px; padding:12px 14px; border-radius:17px; background:var(--surface); box-shadow:0 5px 22px #1f31500a; }
    .report-picker span { color:var(--muted); font-size:13px; font-weight:700; }
    .report-picker select { width:100%; min-width:0; border:1px solid var(--line); border-radius:12px; padding:9px 34px 9px 11px; background:var(--bg); color:var(--text); font:inherit; font-weight:750; }
    .section-head { display:flex; justify-content:space-between; align-items:end; margin:20px 3px 10px; }
    .section-head h2 { margin:0; font-size:19px; }
    .section-head span { color:var(--muted); font-size:13px; }
    .back-nav { width:100%; border:0; border-radius:15px; padding:12px 14px; margin:15px 0 4px; text-align:left; background:var(--surface); color:var(--accent); font-weight:750; }
    .manager-page-head { margin:14px 0 12px; padding:18px; border-radius:var(--radius); background:var(--surface); box-shadow:0 5px 22px #1f31500a; }
    .manager-page-head h2 { margin:0; font-size:22px; }
    .manager-page-head p { margin:5px 0 0; color:var(--muted); }
    .workload-entry { width:100%; margin-top:14px; border:0; border-radius:18px; padding:15px 16px; text-align:left; background:linear-gradient(135deg,#243b85,#496ff2); color:#fff; font-weight:800; box-shadow:0 10px 28px #254cb32e; }
    .workload-entry small { display:block; margin-top:3px; opacity:.76; font-weight:500; }
    .workload-list { display:grid; gap:12px; }
    .workload-card { padding:17px; border-radius:var(--radius); background:var(--surface); box-shadow:0 5px 22px #1f31500a; }
    .workload-card h3 { margin:0; font-size:19px; }
    .role-label { margin-top:3px; color:var(--accent); font-size:13px; font-weight:750; }
    .level { display:inline-block; margin-top:10px; padding:5px 9px; border-radius:9px; background:color-mix(in srgb,var(--accent) 11%,transparent); color:var(--accent); font-size:12px; font-weight:800; }
    .workload-metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
    .workload-metric { padding:10px; border-radius:12px; background:var(--bg); }
    .workload-metric b { display:block; font-size:16px; }
    .workload-metric span { color:var(--muted); font-size:11px; }
    .analysis-block { margin-top:13px; }
    .analysis-block h4 { margin:0 0 5px; font-size:13px; }
    .analysis-block p { margin:0; color:var(--muted); }
    .analysis-list { margin:5px 0 0; padding-left:18px; color:var(--muted); }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .metric { padding:15px 12px; border-radius:18px; background:var(--surface); box-shadow:0 5px 22px #1f31500a; }
    .metric strong { display:block; font-size:21px; }
    .metric span { color:var(--muted); font-size:12px; }
    .metric.missed strong { color:var(--red); }
    .managers { display:grid; gap:10px; }
    .manager { width:100%; border:1px solid transparent; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; text-align:left; padding:15px; border-radius:var(--radius); background:var(--surface); color:var(--text); box-shadow:0 5px 22px #1f31500a; }
    .manager.active { border-color:color-mix(in srgb,var(--accent) 55%,transparent); }
    .lamp { width:11px; height:11px; border-radius:50%; background:var(--green); box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 14%,transparent); }
    .lamp.yellow { background:var(--yellow); box-shadow:0 0 0 5px color-mix(in srgb,var(--yellow) 14%,transparent); }
    .lamp.red { background:var(--red); box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 14%,transparent); }
    .manager-name { font-weight:750; }
    .manager-meta { color:var(--muted); font-size:13px; margin-top:2px; }
    .chevron { color:var(--muted); font-size:20px; }
    .calls { display:grid; gap:11px; }
    .call { padding:16px; border-radius:var(--radius); background:var(--surface); box-shadow:0 5px 22px #1f31500a; }
    .call.missed { border:1px solid color-mix(in srgb,var(--red) 45%,transparent); background:color-mix(in srgb,var(--red) 7%,var(--surface)); }
    .call-top { display:flex; align-items:center; gap:9px; }
    .call-time { font-weight:800; font-size:17px; }
    .direction { padding:4px 8px; border-radius:9px; background:color-mix(in srgb,var(--blue) 10%,transparent); color:var(--blue); font-size:12px; font-weight:700; }
    .direction.missed { background:color-mix(in srgb,var(--red) 12%,transparent); color:var(--red); }
    .duration { margin-left:auto; color:var(--muted); font-size:13px; }
    .phone { color:var(--muted); margin-top:5px; font-size:13px; }
    .summary { margin:13px 0 0; padding:12px 13px; border-radius:14px; background:var(--bg); }
    .summary-label { color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
    .summary p { margin:5px 0 0; }
    .facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .fact { padding:5px 8px; border-radius:9px; background:color-mix(in srgb,var(--accent) 9%,transparent); font-size:12px; }
    .open-call { width:100%; margin-top:11px; border:0; border-radius:12px; padding:10px; background:var(--accent); color:var(--accent-text); font-weight:700; }
    .transcript { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
    .transcript-time { color:var(--muted); font-size:13px; margin-bottom:10px; }
    .turn { padding:10px 12px; margin:7px 0; border-radius:13px; background:var(--bg); white-space:pre-wrap; }
    .turn.manager { border-left:3px solid var(--blue); }
    .turn.client { border-left:3px solid var(--green); }
    .turn b { display:block; font-size:12px; margin-bottom:3px; color:var(--muted); }
    .state { padding:28px 20px; border-radius:var(--radius); text-align:center; background:var(--surface); color:var(--muted); }
    .spinner { width:24px; height:24px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:6px 10px; border-radius:12px; background:#ffffff1a; font-size:12px; }
    .hidden { display:none !important; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (min-width:640px) { .managers { grid-template-columns:1fr 1fr; } .hero { padding:30px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">Отдел сопровождения</div>
      <h1 id="heroTitle">Разговоры за день</h1>
      <p id="heroDate">Загрузка отчётов…</p>
      <div class="status-pill" id="reportStatus">● Подключаем данные</div>
    </section>
    <label class="report-picker" id="datePicker"><span>📅 Дата отчёта</span><select id="reportDate" aria-label="Выберите дату отчёта"></select></label>
    <section id="content"><div class="state"><div class="spinner"></div>Загружаем отчёт</div></section>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready(); tg?.expand();
    const initData = tg?.initData || "";
    const state = { reports: [], day: null, report: null, view: "overview", extension: null, calls: [] };
    const el = id => document.getElementById(id);
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    const duration = seconds => { seconds=Number(seconds||0); const h=Math.floor(seconds/3600), m=Math.floor(seconds%3600/60), s=seconds%60; return [h&&`${h} ч`,m&&`${m} мин`,(!h&&!m||s)&&`${s} сек`].filter(Boolean).join(" "); };
    const dayLabel = iso => new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",weekday:"short"}).format(new Date(`${iso}T12:00:00`));
    const moscowDateTime = value => new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Moscow"}).format(new Date(value))+" МСК";
    const moscowShort = value => new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Moscow"}).format(new Date(value));
    const offsetTime = seconds => { seconds=Math.max(0,Math.floor(Number(seconds)||0)); return `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`; };
    const periodLabel = report => report.period_start&&report.period_end?`${moscowDateTime(report.period_start)} — ${moscowDateTime(report.period_end)}`:dayLabel(report.report_day);
    const telegramBack = tg?.BackButton;
    async function api(path) {
      if (!initData) throw new Error("Откройте приложение кнопкой внутри Telegram-бота");
      const response = await fetch(path,{headers:{Authorization:`tma ${initData}`}});
      if (!response.ok) { const body=await response.json().catch(()=>({})); throw new Error(body.detail||`Ошибка ${response.status}`); }
      return response.json();
    }
    function setError(error) { el("content").innerHTML=`<div class="state">${esc(error.message||error)}</div>`; el("reportStatus").textContent="● Нет доступа"; }
    function renderDates() {
      const picker=el("reportDate");
      picker.innerHTML=state.reports.map(r=>`<option value="${esc(r.report_day)}" ${r.report_day===state.day?'selected':''}>${esc(dayLabel(r.report_day))}</option>`).join("");
      picker.onchange=()=>selectDay(picker.value);
    }
    function reportLamp(item) { if(item.analysis_errors) return "red"; if(item.recordings>item.analysis_completed) return "yellow"; return ""; }
    function showOverviewHeader() {
      el("heroTitle").textContent="Разговоры за день";
      el("heroDate").textContent=periodLabel(state.report);
      telegramBack?.hide();
    }
    function renderReport() {
      const report=state.report, people=Object.entries(report.employees||{});
      showOverviewHeader();
      el("reportStatus").textContent=report.status==="processing"?"● Расшифровки формируются":report.status==="attention"?"● Есть ошибки обработки":"● Отчёт готов";
      const totalDuration=people.reduce((sum,[,x])=>sum+Number(x.duration_seconds||0),0);
      el("content").innerHTML=`
        <div class="section-head"><h2>Итоги</h2><span>${esc(report.total_calls)} звонков</span></div>
        <section class="metrics">
          <div class="metric"><strong>${report.total_calls}</strong><span>всего звонков</span></div>
          <div class="metric"><strong>${duration(totalDuration)}</strong><span>общая длительность</span></div>
          <div class="metric"><strong>${report.completed_calls}</strong><span>расшифровано</span></div>
          <div class="metric missed"><strong>${report.missed_calls||0}</strong><span>недозвонов</span></div>
        </section>
        <button class="workload-entry" id="openWorkload">📊 Анализ занятости<small>Телефонная нагрузка и соответствие ролям сотрудников</small></button>
        <div class="section-head"><h2>Менеджеры</h2><span>нажмите для звонков</span></div>
        <section class="managers">${people.map(([ext,item])=>`
          <button class="manager" data-ext="${esc(ext)}">
            <span class="lamp ${reportLamp(item)}"></span><span><div class="manager-name">${esc(item.name)}</div>
            <div class="role-label">${esc(item.role_title||"")}</div>
            <div class="manager-meta">${item.calls} звонков · ${duration(item.duration_seconds)} · ${item.analysis_completed}/${item.recordings} расшифровок · <span style="color:var(--red)">${item.missed_calls||0} недозвонов</span></div></span><span class="chevron">›</span>
          </button>`).join("")}</section>`;
      document.querySelectorAll(".manager").forEach(button=>button.onclick=()=>loadCalls(button.dataset.ext));
      el("openWorkload").onclick=renderWorkloadPage;
    }
    async function selectDay(day) {
      state.day=day; state.extension=null; state.calls=[]; renderDates();
      el("content").innerHTML='<div class="state"><div class="spinner"></div>Загружаем день</div>';
      try { state.report=await api(`/api/support/reports/${day}`); renderReport(); } catch(error){ setError(error); }
    }
    async function loadCalls(extension) {
      state.view="manager"; state.extension=extension; state.calls=[]; renderReport();
      renderManagerPage(true);
      try { const data=await api(`/api/support/reports/${state.day}/employees/${encodeURIComponent(extension)}/calls`); state.calls=data.items; renderManagerPage(); }
      catch(error){ renderManagerPage(false,error); }
    }
    function goBack() {
      state.view="overview"; state.extension=null; state.calls=[]; renderReport(); renderDates();
      window.scrollTo({top:0,behavior:"smooth"});
    }
    telegramBack?.onClick(goBack);
    const workloadLevel = level => ({no_data:"Недостаточно данных",low:"Низкая нагрузка",moderate:"Умеренная нагрузка",high:"Высокая нагрузка",overloaded:"Очень высокая нагрузка"}[level]||"Анализ готов");
    const analysisList = (title,items) => items?.length?`<div class="analysis-block"><h4>${esc(title)}</h4><ul class="analysis-list">${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul></div>`:"";
    function renderWorkloadPage() {
      state.view="workload"; state.extension=null; state.calls=[];
      el("heroTitle").textContent="Анализ занятости";
      el("heroDate").textContent=periodLabel(state.report);
      telegramBack?.show();
      const analyses=state.report.workload_analyses||{};
      const cards=Object.entries(state.report.employees||{}).map(([ext,manager])=>{
        const item=analyses[ext];
        if(!item) return `<article class="workload-card"><h3>${esc(manager.name)}</h3><div class="role-label">${esc(manager.role_title||"")}</div><div class="analysis-block"><h4>Цель роли</h4><p>${esc(manager.role_objective||"")}</p></div><div class="state" style="margin-top:12px">Анализ появится после завершения отчёта в 20:00</div></article>`;
        if(item.status==="processing") return `<article class="workload-card"><h3>${esc(manager.name)}</h3><div class="role-label">${esc(item.role_title)}</div><div class="state" style="margin-top:12px"><div class="spinner"></div>Анализ формируется</div></article>`;
        if(item.status==="error") return `<article class="workload-card"><h3>${esc(manager.name)}</h3><div class="role-label">${esc(item.role_title)}</div><div class="state" style="margin-top:12px">Не удалось сформировать анализ</div></article>`;
        const m=item.metrics||{}, a=item.analysis||{};
        return `<article class="workload-card"><h3>${esc(manager.name)}</h3><div class="role-label">${esc(item.role_title)}</div><span class="level">${esc(workloadLevel(a.workload_level))}</span>
          <div class="workload-metrics"><div class="workload-metric"><b>${m.connected_calls||0}</b><span>состоявшихся</span></div><div class="workload-metric"><b>${duration(m.talk_seconds||0)}</b><span>в разговорах</span></div><div class="workload-metric"><b>${m.missed_calls||0}</b><span>недозвонов</span></div><div class="workload-metric"><b>${duration(m.average_talk_seconds||0)}</b><span>средний разговор</span></div></div>
          <div class="analysis-block"><h4>Телефонная нагрузка</h4><p>${esc(a.workload_summary||"Нет вывода")}</p></div>
          <div class="analysis-block"><h4>Соответствие роли</h4><p>${esc(a.role_alignment||"Нет вывода")}</p></div>
          ${m.peak_hours?.length?`<div class="analysis-block"><h4>Пиковые часы</h4><p>${esc(m.peak_hours.join(", "))}</p></div>`:""}
          ${analysisList("Сильные стороны",a.strengths)}${analysisList("Риски",a.risks)}${analysisList("Рекомендации",a.recommendations)}</article>`;
      }).join("");
      el("content").innerHTML=`<button class="back-nav" id="backFromWorkload">← К менеджерам</button><div class="section-head"><h2>Телефонная занятость</h2><span>после 20:00</span></div><div class="state" style="margin-bottom:12px">Анализ отражает только работу по телефону и не оценивает задачи вне звонков.</div><section class="workload-list">${cards}</section>`;
      el("backFromWorkload").onclick=goBack;
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function callSummary(call) {
      if(call.is_voicemail) return `<div class="summary"><div class="summary-label" style="color:var(--red)">Автоответчик</div><p>${esc(call.summary?.voicemail_reason||"Звонок завершился на автоответчике или голосовой почте.")}</p></div>`;
      if(call.is_missed) return '<div class="summary"><div class="summary-label" style="color:var(--red)">Недозвон</div><p>Разговор не состоялся, поэтому записи и расшифровки нет.</p></div>';
      if(call.analysis_status==="processing"||call.analysis_status==="pending") return '<div class="summary"><div class="summary-label">Выжимка</div><p>Формируется…</p></div>';
      if(call.analysis_status==="error") return '<div class="summary"><div class="summary-label">Выжимка</div><p>Не удалось обработать запись</p></div>';
      if(!call.summary_text) return '<div class="summary"><div class="summary-label">Выжимка</div><p>Для звонка нет доступной записи</p></div>';
      const facts=[...(call.summary?.important_facts||[]),...(call.summary?.next_steps||[])].slice(0,4);
      return `<div class="summary"><div class="summary-label">Кратко</div><p>${esc(call.summary_text)}</p>${facts.length?`<div class="facts">${facts.map(x=>`<span class="fact">${esc(x)}</span>`).join("")}</div>`:""}</div>`;
    }
    function renderManagerPage(loading=false,error=null) {
      const manager=state.report.employees[state.extension];
      if(!manager){ goBack(); return; }
      el("heroTitle").textContent=manager.name;
      el("heroDate").textContent=periodLabel(state.report);
      telegramBack?.show();
      el("content").innerHTML=`<button class="back-nav" id="backToManagers">← Все менеджеры</button>
        <section class="manager-page-head"><h2>${esc(manager.name)}</h2>
          <p>${manager.calls} звонков · ${duration(manager.duration_seconds)} · ${manager.analysis_completed}/${manager.recordings} расшифровок · <span style="color:var(--red)">${manager.missed_calls||0} недозвонов</span></p>
        </section>
        <div class="section-head"><h2>Звонки менеджера</h2><span>${loading?'':state.calls.length}</span></div>
        ${loading?'<div class="state"><div class="spinner"></div>Загружаем звонки</div>':error?`<div class="state">${esc(error.message||error)}</div>`:`
        <section class="calls">${state.calls.length?state.calls.map(call=>{ const dt=new Date(call.started_at); const incoming=["in","incoming"].includes(String(call.direction).toLowerCase()); return `
          <article class="call ${call.is_missed?'missed':''}" data-id="${esc(call.call_id)}"><div class="call-top"><span class="call-time">${esc(moscowShort(dt))}</span>
          <span class="direction ${call.is_missed?'missed':''}">${call.is_voicemail?'● Автоответчик':call.is_missed?'● Недозвон':incoming?'↙ Входящий':'↗ Исходящий'}</span><span class="duration">${duration(call.duration_seconds)}</span></div>
          <div class="phone">${esc(call.client_phone||"Номер не указан")}</div>${callSummary(call)}
          ${call.analysis_status==="completed"?'<button class="open-call">Полная расшифровка</button>':''}<div class="detail"></div></article>`;}).join(""):'<div class="state">У менеджера нет звонков за этот день</div>'}</section>`}`;
      el("backToManagers").onclick=goBack;
      el("content").querySelectorAll(".open-call").forEach(button=>button.onclick=()=>openCall(button.closest(".call")));
      window.scrollTo({top:0,behavior:"smooth"});
    }
    async function openCall(card) {
      const detail=card.querySelector(".detail"), button=card.querySelector(".open-call");
      if(detail.dataset.open){ detail.innerHTML=""; delete detail.dataset.open; button.textContent="Полная расшифровка"; return; }
      button.disabled=true; button.textContent="Загрузка…";
      try { const call=await api(`/api/support/calls/${encodeURIComponent(card.dataset.id)}`); const turns=call.segments||[];
        detail.innerHTML=`<div class="transcript"><div class="transcript-time">Начало звонка: <b>${esc(moscowDateTime(call.started_at))}</b> · длительность ${esc(duration(call.duration_seconds))}</div>${turns.length?turns.map(turn=>`<div class="turn ${esc(turn.speaker)}"><b>${turn.speaker==='manager'?'Менеджер':turn.speaker==='client'?'Клиент':'Спикер'} · ${esc(offsetTime(turn.start))}</b>${esc(turn.text||"")}</div>`).join(""):`<div class="turn"><b>Расшифровка</b>${esc(call.transcript_text||"Нет текста")}</div>`}</div>`;
        detail.dataset.open="1"; button.textContent="Свернуть расшифровку";
      } catch(error){ detail.innerHTML=`<div class="state">${esc(error.message)}</div>`; button.textContent="Повторить"; } finally { button.disabled=false; }
    }
    (async()=>{ try { const data=await api("/api/support/reports"); state.reports=data.items||[]; if(!state.reports.length){ el("content").innerHTML='<div class="state">Пока нет сформированных ежедневных отчётов</div>'; el("reportStatus").textContent='● Отчётов пока нет'; return; } await selectDay(state.reports[0].report_day); } catch(error){ setError(error); } })();
  </script>
</body>
</html>
